# ========================================
# OMA Schema Migration - Configuration
# ========================================
# 이 파일은 schema 단계 전용 설정이다.
# 자격증명은 절대 여기 두지 않는다 → Secrets Manager 시크릿 "이름"만 지정.
# 경로는 ${VAR} 로 변수화하여, 향후 env/schema/app 통합 시
# 기준 경로 변수만 수정하면 전체가 따라오도록 한다.
#

[COMMON]
# ----------------------------------------
# 기준 경로 (통합 시 이 값들만 조정)
# ----------------------------------------
OMA_BASE_DIR=/home/ec2-user/workspace/oma
SCHEMA_DIR=${OMA_BASE_DIR}/schema
WORK_DIR=${SCHEMA_DIR}/work/${APPLICATION_NAME}
OUTPUT_DIR=${WORK_DIR}/output

# ----------------------------------------
# AWS
# ----------------------------------------
AWS_REGION=ap-northeast-2

# ----------------------------------------
# Secrets Manager (자격증명은 시크릿 이름으로만 참조)
#   - SOURCE: Oracle 접속 (딕셔너리/메타데이터는 admin 권장)
#   - TARGET: PostgreSQL 접속 (프로젝트 대상 스키마 소유 계정)
# ----------------------------------------
USE_SECRETS_MANAGER=true
SOURCE_SECRET_NAME=your-oracle-source-secret-name
TARGET_SECRET_NAME=your-postgres-oma-secret-name

# ----------------------------------------
# DB 타입 (접속 모듈이 드라이버를 선택하는 데 사용)
#   - source: oracle
#   - target: postgres
# ----------------------------------------
SOURCE_DB_TYPE=oracle
TARGET_DB_TYPE=postgres

# ----------------------------------------
# 변환 대상 스키마 (프로젝트 섹션에서 오버라이드)
#   - SOURCE_SCHEMA: Oracle 원본 스키마 (대문자)
#   - TARGET_SCHEMA: PostgreSQL 대상 스키마 (소문자)
# ----------------------------------------
SOURCE_SCHEMA=YOUR_OMA_SOURCE_SCHEMA
TARGET_SCHEMA=your_oma_target_schema

# ----------------------------------------
# LLM (Bedrock) - 2차 수동 변환(Agent) 단계에서 사용
#   - 1차(DMS SC)에서는 미사용이나, 2차 LLM 변환을 위해 미리 살려둔다.
# ----------------------------------------
BEDROCK_REGION=ap-northeast-2
BEDROCK_MODEL_ID=global.anthropic.claude-opus-4-8
# LLM 호출 제어 (2차 단계)
LLM_RPM_LIMIT=50
LLM_TIMEOUT_SECONDS=300
LLM_MAX_RETRIES=3
LLM_RETRY_BASE_DELAY=2
LLM_MAX_OUTPUT_TOKENS=16000
LLM_MAX_TOKENS=100000

# ----------------------------------------
# DMS Schema Conversion
#   - S3_BUCKET: 프로젝트에 연결된 S3 (변환 결과 산출 위치)
# ----------------------------------------
DMS_SC_S3_BUCKET=your-dms-sc-s3-bucket
DMS_MIGRATION_PROJECT_ARN=arn:aws:dms:ap-northeast-2:YOUR_ACCOUNT_ID:migration-project:YOUR_OMA_PROJECT_ID
# 산출물 S3 prefix 는 DMS 프로젝트 "이름"으로 자동 해석된다(ARN→이름 조회).
# 예: s3://<bucket>/<project-name>/ (dms-sc-<schema>.zip, action-items/ ...)

# ----------------------------------------
# DMS SC 폴링/타임아웃
#   - CONVERT_TIMEOUT: 0 = 객체수 기반 적응형 (max(600, 300 + n*2))
# ----------------------------------------
CONVERT_TIMEOUT=0
POLL_INTERVAL=15
# Oracle NUMBER PK/FK → BIGINT 변환 설정 적용 여부
CONVERT_NUMBER_TO_BIGINT=true

# ========================================
# 프로젝트별 섹션
#   대상 스키마 명으로 지정한다.
# ========================================
[oma]
APPLICATION_NAME=oma

