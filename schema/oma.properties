# ========================================
# OMA Schema Migration - Configuration
# ========================================
# 이 파일은 schema 단계 전용 설정이다.
# 자격증명은 절대 여기 두지 않는다 → Secrets Manager 시크릿 "이름"만 지정.
# 경로는 ${VAR} 로 변수화하여, 향후 env/schema/app 통합 시
# 기준 경로 변수만 수정하면 전체가 따라오도록 한다.
#
# 변경 이력:
# 2026-08-05 | OMA Team | 초기 생성
#   - 시크릿 기반 설정으로 신규 작성 (env/oma.properties 미사용)
#   - 경로 변수화(OMA_BASE_DIR/SCHEMA_DIR/WORK_DIR/OUTPUT_DIR)
#   - b2b 프로젝트 기본값
# 2026-08-05 | OMA Team | b2c 프로젝트 지원
#   - 프로젝트별(타겟 시크릿/스키마/DMS 프로젝트 ARN) 값을 [b2b]/[b2c] 섹션으로 분리
#   - COMMON 의 SOURCE/TARGET 스키마·타겟 시크릿·DMS ARN 은 프로젝트 섹션이 오버라이드
#   - 실행: python3.11 schema/main.py --app b2c [--phase2|--phase3]

[COMMON]
# ----------------------------------------
# 기준 경로 (통합 시 이 값들만 조정)
# ----------------------------------------
OMA_BASE_DIR=/home/ec2-user/workspace/oma
SCHEMA_DIR=${OMA_BASE_DIR}/schema
WORK_DIR=${SCHEMA_DIR}/work/${APPLICATION_NAME}
OUTPUT_DIR=${WORK_DIR}/output

# ----------------------------------------
# AWS
# ----------------------------------------
AWS_REGION=ap-northeast-2

# ----------------------------------------
# Secrets Manager (자격증명은 시크릿 이름으로만 참조)
#   - SOURCE: Oracle 접속 (딕셔너리/메타데이터는 admin 권장)
#   - TARGET: PostgreSQL 접속 (프로젝트 대상 스키마 소유 계정)
# ----------------------------------------
USE_SECRETS_MANAGER=true
SOURCE_SECRET_NAME=oma-secret-oracle-admin
# TARGET_SECRET_NAME 은 프로젝트 섹션([b2b]/[b2c])에서 지정(오버라이드)한다.

# ----------------------------------------
# 변환 대상 스키마 (프로젝트 섹션에서 오버라이드)
#   - SOURCE_SCHEMA: Oracle 원본 스키마 (대문자)
#   - TARGET_SCHEMA: PostgreSQL 대상 스키마 (소문자)
# ----------------------------------------

# ----------------------------------------
# DB 타입 (접속 모듈이 드라이버를 선택하는 데 사용)
#   - source: oracle
#   - target: postgres
# ----------------------------------------
SOURCE_DB_TYPE=oracle
TARGET_DB_TYPE=postgres

# ----------------------------------------
# LLM (Bedrock) - 2차 수동 변환(Agent) 단계에서 사용
#   - 1차(DMS SC)에서는 미사용이나, 2차 LLM 변환을 위해 미리 살려둔다.
# ----------------------------------------
BEDROCK_REGION=ap-northeast-2
BEDROCK_MODEL_ID=global.anthropic.claude-opus-4-8
# LLM 호출 제어 (2차 단계)
LLM_RPM_LIMIT=50
LLM_TIMEOUT_SECONDS=300
LLM_MAX_RETRIES=3
LLM_RETRY_BASE_DELAY=2
LLM_MAX_OUTPUT_TOKENS=16000
LLM_MAX_TOKENS=100000

# ----------------------------------------
# DMS Schema Conversion
#   - MIGRATION_PROJECT_ARN: 이 프로젝트(b2b) 전용 ARN
#   - S3_BUCKET: 프로젝트에 연결된 S3 (변환 결과 산출 위치)
# ----------------------------------------
# DMS_MIGRATION_PROJECT_ARN 은 프로젝트 섹션([b2b]/[b2c])에서 지정(오버라이드)한다.
DMS_SC_S3_BUCKET=oma-dms-sc-951339201933
# 산출물 S3 prefix 는 DMS 프로젝트 "이름"으로 자동 해석된다(ARN→이름 조회).
# 예: s3://<bucket>/<project-name>/ (dms-sc-<schema>.zip, action-items/ ...)

# ----------------------------------------
# DMS SC 폴링/타임아웃
#   - CONVERT_TIMEOUT: 0 = 객체수 기반 적응형 (max(600, 300 + n*2))
# ----------------------------------------
CONVERT_TIMEOUT=0
POLL_INTERVAL=15
# Oracle NUMBER PK/FK → BIGINT 변환 설정 적용 여부
CONVERT_NUMBER_TO_BIGINT=true

# ========================================
# 프로젝트별 섹션
#   각 프로젝트 고유 값(타겟 시크릿/스키마/DMS SC 프로젝트 ARN)을 지정한다.
#   COMMON 값을 오버라이드하며, --app <name> 으로 섹션을 선택한다.
# ========================================
[b2b]
APPLICATION_NAME=b2b
TARGET_SECRET_NAME=oma-secret-postgres-b2b
SOURCE_SCHEMA=MBR_B2B_MGR
TARGET_SCHEMA=mbr_b2b_mgr
DMS_MIGRATION_PROJECT_ARN=arn:aws:dms:ap-northeast-2:951339201933:migration-project:IP4ODLRQ2FHELKWTA62DXV3J5I

[b2c]
APPLICATION_NAME=b2c
TARGET_SECRET_NAME=oma-secret-postgres-b2c
SOURCE_SCHEMA=MBR_B2C_MGR
TARGET_SCHEMA=mbr_b2c_mgr
DMS_MIGRATION_PROJECT_ARN=arn:aws:dms:ap-northeast-2:951339201933:migration-project:63T6PFV6INAYVNH5LIZULB7XRA
