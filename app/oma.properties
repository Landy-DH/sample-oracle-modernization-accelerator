# ========================================
# OMA (Oracle Migration Assistant) Configuration
# Multi-Source / Multi-Target Support
# ========================================

[COMMON]
# Base Directory
OMA_BASE_DIR=/home/ec2-user/workspace/oma/app

# Language (ko, en)
LANGUAGE=en

# AWS Configuration
AWS_REGION=ap-northeast-2

# ========================================
# LLM Configuration (Bedrock)
# ========================================
BEDROCK_REGION=ap-northeast-2
BEDROCK_MODEL_ID=global.anthropic.claude-opus-4-8

# LLM API Rate Limiting
LLM_RPM_LIMIT=50                    # Requests per minute
LLM_TIMEOUT_SECONDS=300             # API call timeout (대형 조각 재출력 대비)
LLM_MAX_RETRIES=3                   # Max retry attempts
LLM_RETRY_BASE_DELAY=2              # Base delay for exponential backoff (seconds)
LLM_MAX_OUTPUT_TOKENS=16000         # Max output tokens (converted_sql 재출력 대비)

# Large SQL Handling
LLM_MAX_TOKENS=100000               # Max tokens per request (input + output)
LLM_LARGE_SQL_THRESHOLD=50000       # SQL over this char count = large
LLM_CHUNK_OVERLAP=500               # Overlap chars when splitting large SQL

# Validation (Java Validator)
VALIDATION_QUERY_TIMEOUT=10         # 개별 SQL 실행 타임아웃(초) - 대량조회가 검증 전체를 막지 않게
VALIDATION_PROCESS_TIMEOUT=-1       # Java 프로세스 전체 타임아웃(초). -1=무제한(기본).
                                    # 실전은 수천 SQL이라 전체시간 예측 어려움 → 개별 쿼리
                                    # 타임아웃으로 제어. 전체 상한이 필요할 때만 양수로 설정.

# ========================================
# Source & Target DB Types
# ========================================
# Source DB Type: oracle
SOURCE_DB_TYPE=oracle

# Target DB Type: postgres (mysql deprecated)
TARGET_DB_TYPE=postgres

# ========================================
# AWS Secrets Manager
# ========================================
# Credentials are fetched from AWS Secrets Manager
# 용도별 계정 분리:
#   - 딕셔너리 생성(Phase1): admin 계정 (스키마 메타데이터 조회 권한)
#   - 검증 실행(Phase6): service 계정 (실제 서비스 환경 가정 - 서비스 유저로 실행)
#   Source Admin  : oma-source-admin   (system)
#   Source Service: oma-source-service (appdb) - 검증 실행
#   Target Admin  : oma-target-admin   (postgres)
#   Target Service: oma-target-service (appdb) - 딕셔너리 대상 스키마 + 검증 실행

USE_SECRETS_MANAGER=true

# 딕셔너리 생성용 (admin 권한) - 소스는 스키마 조회, 타겟은 딕셔너리 대상 스키마
SOURCE_ADMIN_SECRET=oma-source-admin
TARGET_ADMIN_SECRET=oma-target-admin
TARGET_SERVICE_SECRET=oma-target-service

# 검증 실행용 (service 계정 - 실제 서비스 환경 가정)
SOURCE_SERVICE_SECRET=oma-source-service

# 하위호환 별칭 (기존 코드가 참조)
SOURCE_SECRET_NAME=oma-source-admin
TARGET_SECRET_NAME=oma-target-service

# ========================================
#
#       Deprecated
#
# Source DB Configuration (for local dev only)
# If USE_SECRETS_MANAGER=false, use these values
# ========================================
# Note: In production, use Secrets Manager instead

# Source DB Connection (EPAS / EDB Postgres)
SOURCE_HOST=your_source_host
SOURCE_PORT=your_source_port
SOURCE_DATABASE=your_source_database
SOURCE_CONN_TYPE=service
# Target schema to extract
SOURCE_TARGET_SCHEMA=your_source_target_schema

# ========================================
#
#       Deprecated
#
# Target DB Configuration (for local dev only)
# If USE_SECRETS_MANAGER=false, use these values
# ========================================
# Note: In production, use Secrets Manager instead

# Target DB Connection (Aurora PostgreSQL)
TARGET_HOST=your_target_host
TARGET_PORT=your_target_port
TARGET_DATABASE=your_target_database
TARGET_SCHEMA=your_target_schema

# ========================================
#
#       Deprecated
#
# Optional: DMS Schema Conversion (if using AWS DMS)
# ========================================
DMS_SC_S3_BUCKET=your_dms_s3_bucket
DMS_MIGRATION_PROJECT_ARN=your_dms_migration_project_arn

# ========================================
# Conversion Settings
# ========================================
MAX_WORKERS=7
# 변환 대상 소스 애플리케이션 경로 (MyBatis 매퍼가 있는 프로젝트 루트)
SOURCE_WORKSPACE=/home/ec2-user/workspace/source/your_mapper_directory
# 타겟 출력: 안전한 전용 디렉토리 (기존 앱 소스를 덮어쓰지 않음).
# 실전 배치는 이 결과를 검토 후 실제 타겟 앱으로 수동 반영.
TARGET_WORKSPACE=${PROJECT_WORK_DIR}/target-output

# 매퍼 스캔 제외 디렉토리 (변환 대상이 아닌 백업/파이프라인 산출물)
MAPPER_EXCLUDE_DIRS=app-migration,target,build,.git,node_modules

# ----------------------------------------
# Per-Project Work Directory
# ----------------------------------------
# All work/output artifacts live under projects/<APPLICATION_NAME>/ so that
# multiple projects can be processed concurrently without collision.
# Code modules (converter, utils, ...) are shared and NOT duplicated per project.
PROJECT_WORK_DIR=${OMA_BASE_DIR}/projects/${APPLICATION_NAME}
MAPPER_WORK_DIR=${PROJECT_WORK_DIR}/mappers

# Dictionary Output Path
SCHEMA_DICT_PATH=${PROJECT_WORK_DIR}/output/schema_dictionary.json

# Test Cases / Reports / Checkpoint (all under the project work dir)
TESTCASE_DIR=${PROJECT_WORK_DIR}/testcases
REPORT_DIR=${PROJECT_WORK_DIR}/reports
CHECKPOINT_PATH=${PROJECT_WORK_DIR}/.checkpoint.json

# ========================================
# Application-Specific Section
# Used by CloudFormation deployment
# ========================================
[oma]
APPLICATION_NAME=oma
