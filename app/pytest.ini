[pytest]
# 테스트 수집 규칙: 도메인 클래스(TestCase, TestCaseGenerator 등)를
# 테스트 클래스로 오인하지 않도록 접두어 규칙을 명시한다.
python_files = test_*.py
# 테스트 클래스는 쓰지 않고 함수 기반만 사용한다. 도메인 클래스
# (TestCase, CheckpointManager 등)를 테스트로 오수집하지 않도록 매칭 안 되는 패턴 사용.
python_classes = _NoTestClasses_
python_functions = test_*
testpaths = tests
