[COMMON]
OMA_BASE_DIR=/home/ec2-user/workspace/oma
# ko,en
LANGUAGE=en
AWS_REGION=<YOUR_AWS_REGION>

# Bedrock LLM Configuration
BEDROCK_REGION=<YOUR_BEDROCK_REGION>
BEDROCK_MODEL_ID=<YOUR_BEDROCK_MODEL_ID>

# App Conversion Settings
MAX_WORKERS=7
ORACLE_HOME=/home/ec2-user/oracle
SOURCE_WORKSPACE=/home/ec2-user/workspace/source
TARGET_WORKSPACE=/home/ec2-user/workspace/target
ORACLE_DICT_PATH=${OMA_BASE_DIR}/app/output/oracle_dictionary.json
MAPPER_WORK_DIR=${OMA_BASE_DIR}/app/mappers

# Oracle Connection
ORACLE_HOST=<YOUR_ORACLE_HOST>
ORACLE_PORT=<YOUR_ORACLE_PORT>
ORACLE_SID=<YOUR_ORACLE_SID>
ORACLE_CONN_TYPE=service
ORACLE_USER=<YOUR_ORACLE_USER>
ORACLE_PASSWORD=<YOUR_ORACLE_PASSWORD>
ORACLE_SCHEMA=<YOUR_ORACLE_SCHEMA>

# PostgreSQL Connection (Standard PG* variables)
PGHOST=<YOUR_PGHOST>
PGPORT=5432
PGDATABASE=<YOUR_PGDATABASE>
PGSCHEMA=<YOUR_PGSCHEMA>
PGUSER=<YOUR_PGUSER>
PGPASSWORD=<YOUR_PGPASSWORD>

# MySQL Connection
MYSQL_HOST=<YOUR_MYSQL_HOST>
MYSQL_PORT=3306
MYSQL_DATABASE=<YOUR_MYSQL_DATABASE>
MYSQL_USER=<YOUR_MYSQL_USER>
MYSQL_PASSWORD=<YOUR_MYSQL_PASSWORD>

# Target DB Type (postgres or mysql)
TARGET_DB_TYPE=postgres

# DMS SC Project Configuration (Optional - for schema conversion)
DMS_SC_S3_BUCKET=<YOUR_DMS_SC_S3_BUCKET>
DMS_MIGRATION_PROJECT_ARN=<YOUR_DMS_MIGRATION_PROJECT_ARN>

# ========================================
# Application-Specific Section
# Used by CloudFormation deployment (deploy-omabox.sh / setEnv.sh)
# For App conversion, use [COMMON] section instead
# ========================================
[oma]
APPLICATION_NAME=oma
